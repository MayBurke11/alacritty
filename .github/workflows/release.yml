name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install cmake pkg-config libfreetype6-dev libfontconfig1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev python3
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Create Release
        run: |
          BIN="alacritty.bin"
          cp target/release/alacritty "$BIN"
          chmod +x "$BIN"
          gh release create "${{ github.ref_name }}" "$BIN" \
            --title "Alacritty-Kitty ${{ github.ref_name }}" \
            --notes "Pre-built Linux x86_64 binary. Requires Vulkan/OpenGL drivers." \
            --draft=false \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
